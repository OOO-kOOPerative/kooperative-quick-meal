name: CI/CD Pipeline

on:
  push:
    branches: [main, questionnaire-brunch, interview-schedule-branch]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pages: write
  actions: read

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Markdown lint
        uses: nosborn/github-action-markdown-cli@v3
        with:
          files: "**/*.md"
          config_file: .markdownlint.json

      - name: Check spelling
        uses: codespell-project/actions-codespell@v2
        with:
          ignore_words_file: .codespellignore

      - name: Validate file structure
        run: |
          echo "Проверка структуры проекта:"
          test -f README.md && echo "✓ README.md exists" || echo "✗ README.md missing"
          test -f docs/documentation.md && echo "✓ docs/documentation.md exists" || echo "✗ docs/documentation.md missing"
          test -f content/questionnaire.md && echo "✓ content/questionnaire.md exists" || echo "✗ content/questionnaire.md missing"
          test -f content/protocol.md && echo "✓ content/protocol.md exists" || echo "✗ content/protocol.md missing"
          test -f content/interview-schedule.md && echo "✓ content/interview-schedule.md exists" || echo "✗ content/interview-schedule.md missing"

  deploy-pages:
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      pages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
